<!DOCTYPE html>
<html lang="en" style="background:#000">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" id="lh-viewport" />
    <script>
      // Phones and tablets: lay the page out at the stage's own 960x720 (fitted, the screen's aspect)
      // and let the browser's page zoom shrink it to the screen, instead of the stage's CSS scale.
      // WebKit backs every composited layer at its untransformed size times the device pixel ratio,
      // so under a downscaling transform each window layer cost up to (3 / 0.41)^2 = 54 times the
      // pixels it shows (a phone ran out of memory and reloaded); a page zoom is honoured. Canvas
      // code sizes from devicePixelRatio, so it reads the pixels per CSS px that this zoom gives.
      // (Desktop browsers ignore the viewport tag: nothing changes there.)
      ;(function () {
        if (!matchMedia('(pointer: coarse)').matches) return
        var m = document.getElementById('lh-viewport')
        // device px per CSS px before the zoom (read first: some engines fold the zoom in)
        var pd = Object.getOwnPropertyDescriptor(window, 'devicePixelRatio') || Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window), 'devicePixelRatio')
        var native = function () { return pd && pd.get ? pd.get.call(window) : 1 }
        var dpr = native() || 1
        var vv = window.visualViewport, seen = 0
        var fit = function () {
          // the visible area in device-width px (the visual viewport times its zoom: the same at
          // any zoom), not the screen's (a browser's window can be narrower)
          var z = vv ? vv.scale : 1
          var sw = (vv ? vv.width : innerWidth) * z, sh = (vv ? vv.height : innerHeight) * z
          if (Math.abs(sw - seen) < 1) return
          seen = sw
          var w = Math.max(960, Math.ceil((720 * sw) / sh)), k = sw / w
          m.setAttribute('content', 'width=' + w + ', initial-scale=' + k + ', minimum-scale=' + k)
        }
        // (Mobile Safari applies the new tag at its next layout. A browser that ignores the tag
        // keeps its own layout width and a zoom of 1: then nothing changes.) Text autosizing
        // off: a wide page zoomed out would get its text enlarged.
        fit()
        document.documentElement.style.webkitTextSizeAdjust = '100%'
        document.documentElement.style.textSizeAdjust = '100%'
        // a rotation or a new window width: fitted again (a toolbar showing or hiding changes
        // only the height)
        addEventListener('resize', function () { setTimeout(fit, 50) })
        // the device px per CSS px that the zoom gives (an engine that already folds it in: its own)
        Object.defineProperty(window, 'devicePixelRatio', {
          configurable: true,
          get: function () {
            var n = native()
            return Math.abs(n - dpr) > 0.01 ? n : dpr * (vv ? vv.scale : 1)
          },
        })
      })()
    </script>
    <title>Longhorn</title>
    <link rel="icon" type="image/svg+xml" href="/img/desktop/flag.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
